<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Product preview card component</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .attribution { font-size: 0.8rem; text-align: center; margin-top: 1rem; font-family: 'Montserrat', sans-serif; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <!-- Main Card Container -->
  <main class="card">
    
    <!-- Left Column: Responsive Product Image -->
    <picture class="card-img">
      <source media="(min-width: 600px)" srcset="./images/image-product-desktop.jpg">
      <img src="./images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum bottle surrounded by green leaves">
    </picture>

    <!-- Right Column: Product Details -->
    <div class="card-content">
      <p class="sub-heading">PERFUME</p>

      <h1 class="heading">Gabrielle Essence Eau De Parfum</h1>

      <p class="text">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>

      <!-- Price Wrapper -->
      <div class="price-box">
        <span class="current-price">$149.99</span>
        <s class="old-price">$169.99</s>
      </div>

      <!-- Button with Cart Icon -->
      <button type="button" class="btn">
        <img src="./images/icon-cart.svg" alt="" aria-hidden="true">
        <span>Add to Cart</span>
      </button>
    </div>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/battleshopventureswaqas-blip">Waqas</a>.
  </footer>

</body>
</html>
